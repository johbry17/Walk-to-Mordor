<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walk to Mordor</title>
  <meta name="description" content="Three journeys through Middle-earth, powered by real walking data.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ── Header ───────────────────────────────────────────────────── -->
  <header class="site-header" role="banner">
    <div class="header-title">
      <span class="title-main">The Walk to Mordor</span>
      <span class="title-sub">Hobbit walkin' Middle-Earth</span>
    </div>

    <nav class="mode-nav" role="tablist" aria-label="Journey mode">
      <button class="mode-btn active" data-mode="ALL"     role="tab" aria-selected="true"  tabindex="0">All Time</button>
      <button class="mode-btn"        data-mode="Mordor"  role="tab" aria-selected="false" tabindex="-1">Frodo</button>
      <button class="mode-btn"        data-mode="Return"  role="tab" aria-selected="false" tabindex="-1">Aragorn</button>
      <button class="mode-btn"        data-mode="Hobbit"  role="tab" aria-selected="false" tabindex="-1">Bilbo</button>
    </nav>

    <div class="clock-toggle" role="group" aria-label="Time mode">
      <button class="clock-btn active" data-clock="MY" aria-pressed="true">My Time</button>
      <button class="clock-btn"        data-clock="ME" aria-pressed="false">Middle-earth</button>
    </div>

    <button id="tl-prev" class="tl-nav-btn" aria-label="Previous step" title="Previous (←)" disabled>‹</button>

    <button id="play-btn" class="play-btn" aria-label="Play journey">
      <svg class="icon-play"  viewBox="0 0 24 24" aria-hidden="true"><polygon points="5,3 19,12 5,21"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>

    <button id="tl-next" class="tl-nav-btn" aria-label="Next step" title="Next (→)">›</button>

    <div class="tl-speed" role="group" aria-label="Playback speed">
      <button class="speed-btn" data-speed="0.5" aria-pressed="false" aria-label="Half speed">½×</button>
      <button class="speed-btn active" data-speed="1" aria-pressed="true" aria-label="Normal speed">1×</button>
      <button class="speed-btn" data-speed="2" aria-pressed="false" aria-label="Double speed">2×</button>
    </div>
  </header>

  <!-- ── Main area (map + info panel) ─────────────────────────────── -->
  <main class="main-area">

    <!-- Info panel floats over the map -->
    <aside class="info-panel" aria-live="polite" aria-label="Journey information">
      <div class="info-date" id="info-date">—</div>

      <div id="info-body"></div>

      <!-- Journey status rows (ALL TIME mode, desktop only) -->
      <div class="journey-rows" id="journey-rows">
        <div class="journey-row" data-journey="Mordor">
          <span class="jr-dot" style="background:#C17F40"></span>
          <span class="jr-name">Frodo</span>
          <div class="jr-bar"><div class="jr-fill" id="fill-Mordor"></div></div>
          <span class="jr-val" id="val-Mordor">—</span>
        </div>
        <div class="journey-row" data-journey="Return">
          <span class="jr-dot" style="background:#4A7C8E"></span>
          <span class="jr-name">Aragorn</span>
          <div class="jr-bar"><div class="jr-fill" id="fill-Return"></div></div>
          <span class="jr-val" id="val-Return">—</span>
        </div>
        <div class="journey-row" data-journey="Hobbit">
          <span class="jr-dot" style="background:#5F8A5A"></span>
          <span class="jr-name">Bilbo</span>
          <div class="jr-bar"><div class="jr-fill" id="fill-Hobbit"></div></div>
          <span class="jr-val" id="val-Hobbit">—</span>
        </div>
      </div>
    </aside>

    <!-- Pause badge and reset: outside the transformable layer so they stay fixed -->
    <div class="pause-badge" id="pause-badge" hidden>
      <span>⏸ Month-Long Pause</span><br>to Lament for Gandalf
    </div>

    <!-- Floating map controls: zoom + reset, top-right -->
    <div class="map-controls" role="group" aria-label="Map controls">
      <button class="map-ctrl-btn" id="zoom-in"   aria-label="Zoom in"       title="Zoom in">+</button>
      <button class="map-ctrl-btn" id="zoom-out"  aria-label="Zoom out"      title="Zoom out">−</button>
      <button class="map-ctrl-btn" id="reset-view" aria-label="Reset map view" title="Reset view (double-click map)">&#8857;</button>
    </div>

    <!-- Viewport clips; layer transforms for zoom/pan -->
    <div class="map-viewport" id="map-viewport">
      <div class="map-layer" id="map-layer">
        <img id="base-map"
             src="assets/preview-mapome-slim.svg"
             alt="Middle-earth map (mapome by k1tesurfen, CC BY-SA 4.0)"
             draggable="false">

        <svg id="overlay"
             viewBox="0 0 3200 2400"
             preserveAspectRatio="xMidYMid meet"
             aria-hidden="true">
          <!-- Populated by map.js -->
        </svg>
      </div>
    </div>

  </main>

  <!-- ── Timeline bar ──────────────────────────────────────────────── -->
  <footer class="timeline-bar" role="contentinfo">
    <span class="tl-label" id="tl-start" aria-hidden="true">—</span>

    <div class="tl-slider-wrap">
      <input type="range"
             id="timeline"
             class="timeline-slider"
             min="0" max="100" value="0" step="1"
             aria-label="Timeline position">
      <!-- Frodo My Time pause visual -->
      <div class="tl-pause-range" id="tl-pause-range" aria-hidden="true" hidden></div>
    </div>

    <span class="tl-label" id="tl-end" aria-hidden="true">—</span>
  </footer>

  <!-- Site footer -->
  <footer class="site-footer" role="contentinfo">
    <span class="footer-tagline">Fluent in Data. Fluent in Human.</span>

    <span class="footer-owner">
      &copy; <span id="copyright-year">2026</span>
      Bryan C. Johns
    </span>

    <nav class="footer-links" aria-label="External links">
      <a
        href="https://informedwanderer.com/"
        target="_blank"
        rel="noopener noreferrer"
        class="portfolio-link"
      >
        Portfolio
      </a>

      <a
        href="https://www.linkedin.com/in/b-johns/"
        target="_blank"
        rel="noopener noreferrer"
        class="linkedin-link"
      >
        LinkedIn
      </a>

      <a
        href="https://github.com/johbry17/walk-to-mordor"
        target="_blank"
        rel="noopener noreferrer"
        class="github-link"
      >
        GitHub
      </a>
    </nav>
  </footer>

  <script>
    const yearElement = document.getElementById('copyright-year');
    if (yearElement) {
      yearElement.textContent = new Date().getFullYear();
    }
  </script>

  <script src="js/timeline.js"></script>
  <script src="js/map.js"></script>
  <script src="js/pan-zoom.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
